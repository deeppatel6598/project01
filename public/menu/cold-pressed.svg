    <circle cx="150" cy="72" r="26" fill="#d7d3d3" stroke="#201e1d" stroke-width="8"/>
    <g stroke="#201e1d" stroke-width="6">
      <path d="M150 50v44M128 72h44M134 56l32 32M166 56l-32 32"/>
    </g>
  </g>
