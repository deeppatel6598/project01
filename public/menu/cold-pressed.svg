<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cold pressed juice">
  <rect width="200" height="200" fill="#d7d3d3"/>
  <g transform="translate(100 100) scale(0.82) translate(-100 -100)">
    <!-- straw -->
    <path d="M132 30 108 96" stroke="#201e1d" stroke-width="9" stroke-linecap="square"/>
    <!-- glass -->
    <path d="M56 60h88l-12 116H68z" fill="none" stroke="#201e1d" stroke-width="9"/>
    <!-- juice line -->
